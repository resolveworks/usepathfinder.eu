# nginx config for the static usepathfinder.eu site.
# TLS terminates upstream, so this only listens on :80 and serves files.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root   /usr/share/nginx/html;
    charset utf-8;

    index  index.html;

    # --- gzip text-based responses --------------------------------------------
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # --- fingerprinted build assets: content-hashed, immutable cache ----------
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Pages and everything else: never cache so new deploys are picked up ---
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
